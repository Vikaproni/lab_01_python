[project]
name = "toolkit"
version = "0.1.0"
description = "Калькулятор и конвертер"
requires-python = ">= 3.12"
dependencies = ["pytest>=8.4.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']



